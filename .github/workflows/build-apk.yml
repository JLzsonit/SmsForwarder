name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Restore signing keystore (fixed key, same signature for every build)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/app.jks
          printf 'keyAlias=smsforwarder\nkeyPassword=%s\nstoreFile=../keystore/app.jks\nstorePassword=%s\n' "$KEYSTORE_PASS" "$KEYSTORE_PASS" > keystore/keystore.properties
          keytool -list -v -keystore keystore/app.jks -storepass "$KEYSTORE_PASS" | grep -E "Alias name|SHA256:" || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
