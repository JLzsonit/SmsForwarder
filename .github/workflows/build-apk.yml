name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Generate CI signing key
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/app.jks -alias cicI -keyalg RSA -keysize 2048 -validity 10000 -storepass ci123456 -keypass ci123456 -dname "CN=SmsForwarder CI, OU=CI, O=CI, L=CI, ST=CI, C=CN"
          printf 'keyAlias=cicI\nkeyPassword=ci123456\nstoreFile=../keystore/app.jks\nstorePassword=ci123456\n' > keystore/keystore.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
